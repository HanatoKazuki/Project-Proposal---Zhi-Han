<style>
    body,html {
        margin: 0;
    }
    .navbar-brand{
        display: flex;
        align-items: center;
        padding: 20px;
    }

    .navbar-brand a {
        text-decoration: none;
        font-size: 32px;
        color: white;
    }

    .navbar {
        background-color: rgba(0, 0, 0, 0.5); /*rgb(0, 119, 255)*/
        display: flex;
        justify-content: space-between;
    }

    .navbar-navigation{
        list-style: none;
        display: flex;
        flex-direction: row;
    }

    .navbar-navigation li {
        margin-right: 10px;
        font-size: 24px;
        padding: 10px 20px;
        color: white;
    }

    .navbar-navigation a {
        transition: 0.5s;
    }

    .navbar-navigation a:hover{
        color: black;
        background-color: white;
        padding: 10px 20px;
        border-radius: 10px;
    }

    #logoutIcon {
        color: white;
    }

    #logoutIcon:hover{
        color: black;
        background-color: white;
        border-radius: 10px;
    }

    .container {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 50px;
        margin-top: 50px;
    }

    .box.balance, .box.income, .box.expense {
        height: 20vh;
        box-shadow: 5px 5px 10px 5px;
        width: 500px;
        max-width: 500px;
    }   
    

    .box {
        transition: transform 0.5s ease;
        box-sizing: border-box;
        background-color: white;
    }
    .box:hover {
        transform: translate(0, -10px);
        transform: scale(1.1);
    }

    .balanceTitle {
        padding: 20px;
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 0px;
    }

    .balance {
        padding: 20px;
        font-size: 22px;
        font-weight: bold;
        margin-top: 0;
    }
body {
    background-image: url(./images/register-background.png);
    background-size: cover; /*makes the image strecthed out to cover whole page*/
    background-repeat: no-repeat;
    background-position: center center;
    background-attachment: fixed;
    height: 90vh;
    scroll-behavior: smooth;
}

</style>
